<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Máy lạnh</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --fg: #1d2129; --muted: #6b7280; --accent: #2563eb; --on: #16a34a; --off: #9ca3af; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111318; --card: #1c1f26; --fg: #e5e7eb; --muted: #9ca3af; } }
  body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card h2 { font-size: 1.05rem; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: .85rem; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .temp { font-size: 2rem; font-weight: 600; min-width: 4ch; text-align: center; }
  button, select { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--off); background: var(--card); color: var(--fg); }
  button.power { flex: 1; color: #fff; border: 0; }
  button.power.on { background: var(--on); } button.power.off { background: var(--off); }
  .err { color: #dc2626; font-size: .85rem; min-height: 1em; margin-top: 8px; }
</style>
</head>
<body>
<h1>Máy lạnh</h1>
<div class="grid" id="units"></div>
<script>
const FANS = {
  mitsubishi112: ["quiet", "low", "med", "max"],
  coolix: ["auto", "min", "med", "max"],
  daikin152: ["auto", "quiet", "min", "low", "med", "high", "max"],
};
const MODES = ["cool", "heat", "dry", "auto"];
const LIMITS = { mitsubishi112: [16, 31], coolix: [17, 30], daikin152: [18, 32] };

// Throws an Error carrying the HTTP status and the server's detail (string or pydantic list), even for non-JSON bodies.
async function api(path, options) {
  const res = await fetch(path, options);
  let body = null;
  try { body = await res.json(); } catch (_) { /* proxy error pages are HTML: fall back to the status line */ }
  if (!res.ok) {
    let detail = body && body.detail;
    if (Array.isArray(detail)) detail = detail.map(d => d.msg || JSON.stringify(d)).join("; ");
    throw new Error(`HTTP ${res.status} ${detail || res.statusText}`);
  }
  return body;
}

function el(tag, props = {}, children = []) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

async function send(unit, state, card) {
  const err = card.querySelector(".err");
  err.textContent = "Đang gửi…";
  try {
    const body = await api(`/api/units/${encodeURIComponent(unit.id)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) });
    unit.state = body.state;
    render(unit, card);
  } catch (e) { err.textContent = `Lỗi: ${e.message}`; }
}

function render(unit, card) {
  const known = unit.state != null;
  const s = unit.state || { power: false, mode: "cool", temp: 25, fan: FANS[unit.protocol][unit.protocol === "mitsubishi112" ? 2 : 0] };
  const [lo, hi] = LIMITS[unit.protocol];
  const label = !known ? "Chưa có lệnh nào — bấm để bật" : s.power ? "Lệnh cuối: BẬT — bấm để tắt" : "Lệnh cuối: TẮT — bấm để bật";
  const power = el("button", { className: `power ${s.power ? "on" : "off"}`, textContent: label });
  const minus = el("button", { textContent: "−" });
  const plus = el("button", { textContent: "+" });
  const mode = el("select", {}, MODES.map(m => new Option(m, m, false, m === s.mode)));
  const fan = el("select", {}, FANS[unit.protocol].map(f => new Option(f, f, false, f === s.fan)));
  card.replaceChildren(
    el("h2", { textContent: unit.name }),
    el("div", { className: "muted", textContent: `${unit.protocol} · trạng thái lệnh cuối (IR một chiều, không đọc được máy thật)` }),
    el("div", { className: "row" }, [power]),
    el("div", { className: "row" }, [minus, el("span", { className: "temp", textContent: known ? `${s.temp}°` : "–" }), plus]),
    el("div", { className: "row" }, [mode, fan]),
    el("div", { className: "err" }),
  );
  power.onclick = () => send(unit, { ...s, power: !s.power }, card);
  for (const [button, d] of [[minus, -1], [plus, 1]]) {
    button.onclick = () => send(unit, { ...s, power: true, temp: Math.min(hi, Math.max(lo, s.temp + d)) }, card);
  }
  mode.onchange = e => send(unit, { ...s, power: true, mode: e.target.value }, card);
  fan.onchange = e => send(unit, { ...s, power: true, fan: e.target.value }, card);
}

(async () => {
  const grid = document.getElementById("units");
  try {
    for (const unit of await api("/api/units")) {
      const card = el("div", { className: "card" });
      grid.appendChild(card);
      render(unit, card);
    }
  } catch (e) {
    grid.replaceChildren(el("div", { className: "err", textContent: `Không tải được danh sách máy lạnh: ${e.message}` }));
  }
})();
</script>
</body>
</html>
