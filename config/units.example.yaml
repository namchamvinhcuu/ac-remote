# Copy to config/units.yaml and adjust.
rm4:
  host: 192.168.5.48          # default RM4 mini for every unit

units:
  - id: reetech
    name: Reetech
    protocol: mitsubishi112
  - id: midea
    name: Midea
    protocol: coolix
  - id: midea2
    name: Midea 2
    protocol: coolix
    rm4_host: 192.168.5.53    # second RM4 mini, placed so only midea2 sees its IR
  # Daikin with an ARC480-family remote (home site, its own RM4 mini):
  # - id: daikin
  #   name: Daikin
  #   protocol: daikin152
  #   rm4_host: 192.168.68.59
